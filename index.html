<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>beezeedeepsky Astro Shop</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* 🌌 STARS */
.stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.7;
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

/* HEADER */
header{text-align:center;padding:30px;}

/* SOCIAL */
.socials{
display:flex;
gap:10px;
overflow-x:auto;
padding:10px;
}

.social{
background:#111;
padding:10px 15px;
border-radius:8px;
color:white;
text-decoration:none;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
}

.card img{
width:100%;
border-radius:10px;
}

button{
padding:8px;
background:#00ffcc;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

/* CART */
.cart{
position:fixed;
right:10px;
top:10px;
background:#111;
padding:10px;
border-radius:10px;
width:240px;
max-height:400px;
overflow:auto;
}

/* ADMIN */
#adminPanel{
display:none;
background:#111;
padding:10px;
margin:10px;
border-radius:10px;
}

input,textarea{
width:80%;
padding:8px;
margin:5px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<header>
<h1>🌌 beezeedeepsky</h1>
<p>Astrophotographie Shop</p>
</header>

<!-- SOCIAL -->
<div class="socials">
<a class="social" href="https://www.youtube.com/@MoonlightShutter" target="_blank">▶ YouTube</a>
</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Panier</h3>
<div id="cart"></div>
<p>Total : <span id="total">0</span>€</p>

<button id="clearCart">🗑 Vider panier</button>

<a id="paypalLink" href="https://www.paypal.me/NolanPoulain0" target="_blank">
<button>💳 PayPal</button>
</a>
</div>

<!-- ADMIN -->
<button id="adminBtn">🔐 Admin</button>

<div id="adminPanel">

<h3>Ajouter une photo</h3>

<input id="name" placeholder="Nom"><br>
<input id="price" placeholder="Prix"><br>
<textarea id="desc" placeholder="Description"></textarea><br>
<input type="file" id="file"><br>

<button id="addPhotoBtn">Ajouter</button>

</div>

<div class="gallery" id="gallery"></div>

<script>

/* 🌌 STARS */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(5+Math.random()*15)+"s";
document.getElementById("stars").appendChild(s);
}

/* DATA */
let photos = JSON.parse(localStorage.getItem("photos")) || [];
let cart = [];
let isAdmin = false;

/* ADMIN LOGIN */
document.getElementById("adminBtn").addEventListener("click",()=>{
let p = prompt("Mot de passe ?");
if(p==="astro2026"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
render();
}
});

/* ADD PHOTO */
document.getElementById("addPhotoBtn").addEventListener("click",()=>{

let file=document.getElementById("file").files[0];
if(!file) return alert("Ajoute une image");

let reader=new FileReader();

reader.onload=function(e){

photos.push({
id:crypto.randomUUID(),
name:document.getElementById("name").value,
price:parseFloat(document.getElementById("price").value),
desc:document.getElementById("desc").value,
img:e.target.result
});

save();
render();
};

reader.readAsDataURL(file);
});

/* SAVE */
function save(){
localStorage.setItem("photos",JSON.stringify(photos));
}

/* 🗑 DELETE PHOTO (100% FIXED) */
function deletePhoto(id){
photos = photos.filter(p => p.id !== id);
save();
render();
}

/* ADD CART */
function addCart(id){
let item = photos.find(p=>p.id===id);
cart.push(item);
renderCart();
}

/* REMOVE CART */
function removeCart(index){
cart.splice(index,1);
renderCart();
}

/* CLEAR CART */
document.getElementById("clearCart").addEventListener("click",()=>{
cart=[];
renderCart();
});

/* RENDER */
function render(){

let g=document.getElementById("gallery");
g.innerHTML="";

photos.forEach(p=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="${p.img}">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<p>💰 ${p.price}€</p>
<button class="add">🛒 Ajouter</button>
`;

card.querySelector(".add").addEventListener("click",()=>addCart(p.id));

/* 🔐 ADMIN DELETE BUTTON (FIXED) */
if(isAdmin){
let del=document.createElement("button");
del.textContent="❌ Supprimer";
del.addEventListener("click",()=>deletePhoto(p.id));
card.appendChild(del);
}

g.appendChild(card);
});

renderCart();
}

/* CART */
function renderCart(){

let c=document.getElementById("cart");
c.innerHTML="";
let total=0;

cart.forEach((p,i)=>{
c.innerHTML+=`
<p>${p.name} - ${p.price}€
<button onclick="removeCart(${i})">❌</button>
</p>
`;
total+=p.price;
});

document.getElementById("total").innerText=total;

/* PAYPAL */
document.getElementById("paypalLink").href =
"https://www.paypal.me/NolanPoulain0/" + total;
}

/* INIT */
render();

</script>

</body>
</html>
