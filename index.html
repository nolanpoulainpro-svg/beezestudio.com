<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>beezeedeepsky - Astro Shop</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #0b0b1a, #000);
  color:white;
}

/* HEADER */
header {
  text-align:center;
  padding:40px;
}

h1 {
  font-size:50px;
}

/* SOCIAL */
.socials {
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.social {
  flex:0 0 auto;
  background:#111;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

/* ADMIN */
.admin {
  text-align:center;
  margin:10px;
}

#adminPanel {
  display:none;
  text-align:center;
  background:#111;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

input, textarea {
  width:80%;
  max-width:400px;
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:none;
}

/* GALLERY */
.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:30px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:10px;
}

.card img {
  width:100%;
  border-radius:10px;
}

.price {
  color:#00ffcc;
  font-weight:bold;
}

button {
  padding:8px 12px;
  margin-top:5px;
  background:#00ffcc;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<h1>🌌 beezeedeepsky</h1>
<p>Astrophotographie - vente de photos d’univers</p>
</header>

<!-- SOCIALS -->
<div class="socials">
<a class="social" href="https://www.youtube.com/@MoonlightShutter" target="_blank">▶ YouTube</a>
<a class="social" href="#">📸 Instagram</a>
<a class="social" href="#">🎵 TikTok</a>
</div>

<!-- ADMIN BUTTON -->
<div class="admin">
<button onclick="login()">🔐 Mode Admin</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
<h3>Ajouter une photo</h3>

<input id="name" placeholder="Nom"><br>
<input id="price" placeholder="Prix"><br>
<textarea id="desc" placeholder="Description"></textarea><br>
<input id="img" placeholder="URL image"><br>

<button onclick="addProduct()">Ajouter</button>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<!-- CONTACT -->
<section style="text-align:center; padding:40px; background:#0a0a0a;">
<h2>📩 Contact</h2>

<form action="https://formspree.io/f/mwkgbqyz" method="POST">
<input name="name" placeholder="Nom" required><br>
<input name="email" placeholder="Email" required><br>
<textarea name="message" placeholder="Message" required></textarea><br>
<button type="submit">Envoyer</button>
</form>

<p>📧 nolanpoulainpro@gmail.com</p>
</section>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCRRoKAH05jvqlGVgWloPTaOY8XdvX4dqA",
  authDomain: "beezeedeepsky-shop.firebaseapp.com",
  projectId: "beezeedeepsky-shop",
  storageBucket: "beezeedeepsky-shop.firebasestorage.app",
  messagingSenderId: "705714367098",
  appId: "1:705714367098:web:8053abb7dc04109e40e9c3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let isAdmin = false;

/* 🔐 LOGIN ADMIN */
function login() {
  const pass = prompt("Mot de passe admin ?");
  if(pass === "astro2026") {
    isAdmin = true;
    document.getElementById("adminPanel").style.display = "block";
    alert("Mode admin activé");
  } else {
    alert("Incorrect");
  }
}

/* ➕ AJOUT PRODUIT */
function addProduct() {
  db.collection("photos").add({
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    desc: document.getElementById("desc").value,
    img: document.getElementById("img").value
  });

  alert("Photo ajoutée !");
}

/* 📸 AFFICHAGE AUTOMATIQUE */
db.collection("photos").onSnapshot((snap) => {
  let html = "";

  snap.forEach(doc => {
    let p = doc.data();

    html += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <p class="price">${p.price}</p>

        <button onclick="alert('Paiement à connecter')">💰 Acheter</button>
      </div>
    `;
  });

  document.getElementById("gallery").innerHTML = html;
});

</script>

</body>
</html>
