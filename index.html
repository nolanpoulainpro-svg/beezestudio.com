<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>beezeedeepsky - Astro Shop</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* 🌌 STARS */
.stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.7;
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

/* HEADER */
header{
text-align:center;
padding:30px;
}

/* SOCIAL */
.socials{
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
}

.social{
background:#111;
padding:10px 15px;
border-radius:8px;
text-decoration:none;
color:white;
flex:0 0 auto;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
}

.card img{
width:100%;
border-radius:10px;
}

/* CART */
.cart{
position:fixed;
right:10px;
top:10px;
background:#111;
padding:10px;
border-radius:10px;
width:230px;
max-height:400px;
overflow:auto;
}

button{
padding:8px;
background:#00ffcc;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

/* ADMIN */
#adminPanel{
display:none;
background:#111;
padding:10px;
margin:10px;
border-radius:10px;
}

input, textarea{
width:80%;
max-width:300px;
padding:8px;
margin:5px;
}
</style>
</head>

<body>

<!-- 🌌 STARS -->
<div class="stars" id="stars"></div>

<header>
<h1>🌌 beezeedeepsky</h1>
<p>Astrophotographie Shop</p>
</header>

<!-- SOCIAL -->
<div class="socials">
<a class="social" href="https://www.youtube.com/@MoonlightShutter" target="_blank">▶ YouTube</a>
</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Panier</h3>

<div id="cart"></div>

<p>Total : <span id="total">0</span>€</p>

<button onclick="clearCart()">🗑 Vider panier</button>

<a id="paypalLink" href="https://www.paypal.me/NolanPoulain0" target="_blank">
<button>💳 Payer PayPal</button>
</a>
</div>

<!-- ADMIN -->
<button onclick="login()">🔐 Admin</button>

<div id="adminPanel">

<h3>Ajouter une photo</h3>

<input id="name" placeholder="Nom"><br>
<input id="price" placeholder="Prix"><br>
<textarea id="desc" placeholder="Description"></textarea><br>
<input type="file" id="file"><br>

<button onclick="addPhoto()">Ajouter</button>

</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<!-- CONTACT -->
<section style="text-align:center;padding:40px;background:#0a0a0a;">
<h2>📩 Contact</h2>

<form action="mailto:nolanpoulainpro@gmail.com" method="POST" enctype="text/plain">
<input name="name" placeholder="Nom"><br>
<input name="email" placeholder="Email"><br>
<textarea name="message" placeholder="Message"></textarea><br>
<button type="submit">Envoyer</button>
</form>
</section>

<script>

/* 🌌 STARS */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(5+Math.random()*15)+"s";
document.getElementById("stars").appendChild(s);
}

/* DATA */
let photos = JSON.parse(localStorage.getItem("photos")) || [];
let cart = [];
let isAdmin = false;

/* LOGIN */
function login(){
let p = prompt("Mot de passe ?");
if(p==="astro2026"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
}
}

/* ADD PHOTO */
function addPhoto(){

let file=document.getElementById("file").files[0];
if(!file) return alert("Choisis une image");

let reader=new FileReader();

reader.onload=function(e){

photos.push({
name:document.getElementById("name").value,
price:parseFloat(document.getElementById("price").value),
desc:document.getElementById("desc").value,
img:e.target.result
});

localStorage.setItem("photos",JSON.stringify(photos));
render();
};

reader.readAsDataURL(file);
}

/* RENDER */
function render(){

let g=document.getElementById("gallery");
g.innerHTML="";

photos.forEach((p,i)=>{
g.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<p>💰 ${p.price}€</p>

<button onclick="addCart(${i})">🛒 Ajouter</button>
</div>
`;
});

renderCart();
}

/* 🛒 CART ADD */
function addCart(i){
cart.push(photos[i]);
renderCart();
}

/* ❌ REMOVE ITEM */
function removeItem(i){
cart.splice(i,1);
renderCart();
}

/* 🗑 CLEAR CART */
function clearCart(){
cart=[];
renderCart();
}

/* CART DISPLAY */
function renderCart(){

let c=document.getElementById("cart");
c.innerHTML="";
let total=0;

cart.forEach((p,i)=>{
c.innerHTML+=`
<p>${p.name} - ${p.price}€
<button onclick="removeItem(${i})">❌</button>
</p>
`;
total+=p.price;
});

document.getElementById("total").innerText=total;

/* PAYPAL UPDATE */
document.getElementById("paypalLink").href =
"https://www.paypal.me/NolanPoulain0/" + total;
}

render();

</script>

</body>
</html>
