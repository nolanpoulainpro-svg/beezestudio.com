<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>beezeedeepsky - Astro Shop</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #0b0b1a, #000);
  color:white;
}

header {
  text-align:center;
  padding:40px;
}

h1 { font-size:50px; }

.socials {
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.social {
  background:#111;
  padding:10px 15px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  flex:0 0 auto;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:30px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:10px;
}

.card img {
  width:100%;
  border-radius:10px;
}

.price {
  color:#00ffcc;
  font-weight:bold;
}

button {
  padding:8px 12px;
  margin:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.adminPanel {
  display:none;
  background:#111;
  padding:20px;
  text-align:center;
}

input, textarea {
  padding:8px;
  margin:5px;
  width:80%;
  max-width:400px;
}
</style>
</head>

<body>

<header>
<h1>🌌 beezeedeepsky</h1>
<p>Astrophotographie - vente de photos d’espace</p>
</header>

<!-- RÉSEAUX -->
<div class="socials">
<a class="social" href="https://www.youtube.com/@MoonlightShutter" target="_blank">▶ YouTube</a>
<a class="social" href="#">📸 Instagram</a>
<a class="social" href="#">🎵 TikTok</a>
</div>

<!-- ADMIN -->
<div style="text-align:center;">
<button onclick="login()">🔐 Admin</button>
</div>

<div class="adminPanel" id="adminPanel">

<h3>Mode Admin</h3>

<input id="name" placeholder="Nom photo"><br>
<input id="img" placeholder="URL image"><br>
<input id="price" placeholder="Prix"><br>
<textarea id="desc" placeholder="Description"></textarea><br>

<button onclick="addPhoto()">Ajouter photo</button>
</div>

<!-- GALLERY -->
<section class="gallery" id="gallery"></section>

<!-- CONTACT -->
<section style="text-align:center; padding:30px; background:#0a0a0a;">
<h2>📩 Contact</h2>

<form action="https://formspree.io/f/mwkgbqyz" method="POST">
<input name="name" placeholder="Nom" required><br>
<input name="email" placeholder="Email" required><br>
<textarea name="message" placeholder="Message" required></textarea><br>
<button>Envoyer</button>
</form>

<p>📧 nolanpoulainpro@gmail.com</p>
</section>

<script>

const ADMIN_PASS = "astro2026";
let isAdmin = false;

let photos = JSON.parse(localStorage.getItem("photos")) || [
  {
    name:"Nébuleuse Orion",
    img:"https://via.placeholder.com/400x300",
    price:"10€",
    desc:"Photo longue exposition"
  }
];

function render() {
  const g = document.getElementById("gallery");
  g.innerHTML = "";

  photos.forEach((p, i) => {
    g.innerHTML += `
    <div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <p class="price">${p.price}</p>

      <a href="https://paypal.me/" target="_blank">
        <button>💰 Acheter</button>
      </a>

      ${isAdmin ? `<button onclick="del(${i})">❌ Supprimer</button>` : ""}
    </div>`;
  });

  localStorage.setItem("photos", JSON.stringify(photos));
}

function login() {
  let pass = prompt("Mot de passe admin ?");
  if(pass === ADMIN_PASS) {
    isAdmin = true;
    document.getElementById("adminPanel").style.display = "block";
    alert("Admin activé");
    render();
  } else {
    alert("Incorrect");
  }
}

function addPhoto() {
  let name = document.getElementById("name").value;
  let img = document.getElementById("img").value;
  let price = document.getElementById("price").value;
  let desc = document.getElementById("desc").value;

  photos.push({name,img,price,desc});
  render();
}

function del(i) {
  photos.splice(i,1);
  render();
}

render();

</script>

</body>
</html>
