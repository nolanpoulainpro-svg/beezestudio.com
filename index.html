<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Astro Shop</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* STARS */
.stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.7;
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

/* UI */
header{text-align:center;padding:30px;}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
}

.card img{
width:100%;
border-radius:10px;
}

button{
padding:8px;
background:#00ffcc;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

.cart{
position:fixed;
right:10px;
top:10px;
background:#111;
padding:10px;
border-radius:10px;
width:240px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<header>
<h1>🌌 Astro Shop</h1>
</header>

<!-- CART -->
<div class="cart">
<h3>🛒 Panier</h3>
<div id="cart"></div>
<p>Total : <span id="total">0</span>€</p>

<button onclick="clearCart()">Vider</button>

<a id="paypal" href="https://www.paypal.me/NolanPoulain0" target="_blank">
<button>Payer PayPal</button>
</a>
</div>

<button onclick="login()">Admin</button>

<div id="adminPanel" style="display:none">
<h3>Ajouter photo</h3>

<input id="name" placeholder="Nom"><br>
<input id="price" placeholder="Prix"><br>
<textarea id="desc" placeholder="Description"></textarea><br>
<input type="file" id="file"><br>

<button onclick="addPhoto()">Ajouter</button>
</div>

<div class="gallery" id="gallery"></div>

<script>

/* STARS */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(5+Math.random()*15)+"s";
document.getElementById("stars").appendChild(s);
}

/* DATA */
let photos = JSON.parse(localStorage.getItem("photos")) || [];
let cart = [];
let isAdmin = false;

/* LOGIN */
function login(){
let p = prompt("Mot de passe");
if(p==="astro2026"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
render();
}
}

/* ADD PHOTO */
function addPhoto(){

let file=document.getElementById("file").files[0];
if(!file) return alert("Image manquante");

let reader=new FileReader();

reader.onload=function(e){

photos.push({
id:Date.now(),
name:document.getElementById("name").value,
price:parseFloat(document.getElementById("price").value),
desc:document.getElementById("desc").value,
img:e.target.result
});

save();
render();
};

reader.readAsDataURL(file);
}

/* SAVE */
function save(){
localStorage.setItem("photos",JSON.stringify(photos));
}

/* DELETE PHOTO (FIX DEFINITIF) */
function deletePhoto(id){
photos = photos.filter(p => p.id !== id);
save();
render();
}

/* ADD CART (ONLY ID) */
function addCart(id){
cart.push(id);
renderCart();
}

/* REMOVE CART */
function removeCart(i){
cart.splice(i,1);
renderCart();
}

/* CLEAR */
function clearCart(){
cart=[];
renderCart();
}

/* RENDER */
function render(){

let g=document.getElementById("gallery");
g.innerHTML="";

photos.forEach(p=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${p.img}">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<p>💰 ${p.price}€</p>
<button class="add">🛒 Ajouter</button>
`;

div.querySelector(".add").onclick=()=>addCart(p.id);

/* ADMIN DELETE */
if(isAdmin){
let del=document.createElement("button");
del.textContent="❌ Supprimer";
del.onclick=()=>deletePhoto(p.id);
div.appendChild(del);
}

g.appendChild(div);
});

renderCart();
}

/* CART RENDER (FIX NOMS) */
function renderCart(){

let c=document.getElementById("cart");
c.innerHTML="";
let total=0;

cart.forEach((id,i)=>{

let p = photos.find(x=>x.id===id);
if(!p) return;

c.innerHTML+=`
<p>${p.name} - ${p.price}€
<button onclick="removeCart(${i})">❌</button>
</p>
`;

total += p.price;
});

document.getElementById("total").innerText=total;

/* PAYPAL */
document.getElementById("paypal").href =
"https://www.paypal.me/NolanPoulain0/" + total;
}

render();

</script>

</body>
</html>
