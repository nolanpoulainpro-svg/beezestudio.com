<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>beezeedeepsky - NASA Shop</title>

<style>
body {
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* 🌌 STAR BACKGROUND */
.stars {
position:fixed;
width:100%;
height:100%;
background:transparent;
z-index:-1;
}

.star {
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:move 20s linear infinite;
opacity:0.8;
}

@keyframes move {
from {transform:translateY(0);}
to {transform:translateY(100vh);}
}

/* HEADER */
header {
text-align:center;
padding:30px;
}

h1 {
font-size:50px;
}

/* SOCIAL */
.socials {
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
}

.social {
background:#111;
padding:10px 15px;
border-radius:8px;
text-decoration:none;
color:white;
flex:0 0 auto;
}

/* GALLERY */
.gallery {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card {
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:15px;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.card:hover {
transform:scale(1.03);
}

.card img {
width:100%;
border-radius:10px;
}

.price {
color:#00ffcc;
}

/* CART */
.cart {
position:fixed;
right:10px;
top:10px;
background:#111;
padding:10px;
border-radius:10px;
width:220px;
max-height:400px;
overflow:auto;
}

/* PRODUCT MODAL */
.modal {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
}

.modal-content {
background:#111;
padding:20px;
border-radius:10px;
width:300px;
}

button {
padding:8px 12px;
background:#00ffcc;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<header>
<h1>🌌 beezeedeepsky</h1>
<p>NASA Style Astrophotographie Shop</p>
</header>

<!-- SOCIAL -->
<div class="socials">
<a class="social" href="https://www.youtube.com/@MoonlightShutter" target="_blank">▶ YouTube</a>
<a class="social" href="#">📸 Instagram</a>
<a class="social" href="#">🎵 TikTok</a>
</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Panier</h3>
<div id="cart"></div>
<p>Total : <span id="total">0</span>€</p>

<a href="https://www.paypal.me/TONPAYPAL" target="_blank">
<button>💳 PayPal</button>
</a>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3 id="mName"></h3>
<p id="mDesc"></p>
<p class="price" id="mPrice"></p>
<button onclick="addCart()">🛒 Ajouter</button>
<button onclick="closeModal()">Fermer</button>
</div>
</div>

<script>

/* 🌌 STARS */
for(let i=0;i<80;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(10+Math.random()*20)+"s";
document.getElementById("stars").appendChild(s);
}

/* DATA */
let photos = JSON.parse(localStorage.getItem("photos")) || [
{name:"Nébuleuse Orion",desc:"Photo HD NASA style",price:10,img:"https://via.placeholder.com/400x300"}
];

let cart=[];
let selected=null;

/* RENDER */
function render(){
let g=document.getElementById("gallery");
g.innerHTML="";

photos.forEach((p,i)=>{
g.innerHTML+=`
<div class="card" onclick="openProduct(${i})">
<img src="${p.img}">
<h3>${p.name}</h3>
<p class="price">${p.price}€</p>
</div>
`;
});
}

/* PRODUCT PAGE */
function openProduct(i){
selected=photos[i];
document.getElementById("mName").innerText=selected.name;
document.getElementById("mDesc").innerText=selected.desc;
document.getElementById("mPrice").innerText=selected.price+"€";
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

/* CART */
function addCart(){
cart.push(selected);
updateCart();
closeModal();
}

function updateCart(){
let c=document.getElementById("cart");
c.innerHTML="";
let total=0;

cart.forEach(p=>{
c.innerHTML+=`<p>${p.name} - ${p.price}€</p>`;
total+=p.price;
});

document.getElementById("total").innerText=total;
}

/* INIT */
render();
updateCart();

</script>

</body>
</html>
